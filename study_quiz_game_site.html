<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Site - Quiz & Memory Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    h1 { color: #2c3e50; }
    button { margin: 5px; padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 8px; cursor: pointer; }
    button:hover { background: #2980b9; }
    .quiz, .memory-game { margin: 20px auto; max-width: 500px; }
    .question { font-weight: bold; margin: 15px 0; }
    .memory-grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; justify-content: center; margin-top: 20px; }
    .card { width: 80px; height: 80px; background: #95a5a6; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border-radius: 10px; }
    .flipped { background: #ecf0f1; }
  </style>
</head>
<body>
  <h1>📚 Study Hub</h1>
  <p>Choose an activity:</p>
  <button onclick="showSection('quiz')">Take a Quiz</button>
  <button onclick="showSection('memory')">Play Memory Game</button>

  <!-- Quiz Section -->
  <div id="quiz" class="quiz" style="display:none;">
    <h2>📝 Quiz</h2>
    <div id="quiz-container"></div>
    <button onclick="submitQuiz()">Submit Quiz</button>
    <p id="quiz-result"></p>
  </div>

  <!-- Memory Game Section -->
  <div id="memory" class="memory-game" style="display:none;">
    <h2>🧠 Memory Game</h2>
    <div class="memory-grid" id="memory-grid"></div>
    <p id="memory-result"></p>
  </div>

  <script>
    function showSection(id) {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('memory').style.display = 'none';
      document.getElementById(id).style.display = 'block';
    }

    // QUIZ LOGIC
    const quizData = [
      { question: "What is the capital of India?", options: ["Mumbai", "Delhi", "Chennai", "Kolkata"], answer: "Delhi" },
      { question: "2 + 2 = ?", options: ["3", "4", "5", "6"], answer: "4" },
      { question: "Which planet is known as the Red Planet?", options: ["Earth", "Mars", "Venus", "Jupiter"], answer: "Mars" }
    ];

    const quizContainer = document.getElementById('quiz-container');
    quizData.forEach((q, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.innerHTML = `<p>${i+1}. ${q.question}</p>` +
        q.options.map(opt => `<label><input type='radio' name='q${i}' value='${opt}'> ${opt}</label><br>`).join('');
      quizContainer.appendChild(div);
    });

    function submitQuiz() {
      let score = 0;
      quizData.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        if (selected && selected.value === q.answer) score++;
      });
      document.getElementById('quiz-result').textContent = `You scored ${score} / ${quizData.length}`;
    }

    // MEMORY GAME LOGIC
    const emojis = ["🍎","🍎","🍌","🍌","🍇","🍇","🍉","🍉"];
    let cards = [...emojis].sort(() => Math.random() - 0.5);
    const grid = document.getElementById('memory-grid');
    let flipped = [], matched = 0;

    cards.forEach((emoji, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.dataset.index = idx;
      card.onclick = () => flipCard(card);
      grid.appendChild(card);
    });

    function flipCard(card) {
      if (card.classList.contains('flipped') || flipped.length === 2) return;
      card.textContent = card.dataset.emoji;
      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
          matched += 2;
          flipped = [];
          if (matched === cards.length) document.getElementById('memory-result').textContent = "🎉 You won!";
        } else {
          setTimeout(() => {
            flipped.forEach(c => { c.textContent = ''; c.classList.remove('flipped'); });
            flipped = [];
          }, 1000);
        }
      }
    }
  </script>
</body>
</html>
